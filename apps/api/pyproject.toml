[project]
name = "rfq-api"
version = "0.1.0"
description = "FastAPI backend for the RFQ-to-rubric prototype"
readme = "README.md"
authors = [
    { name = "Archit Mishra", email = "mishra.archit4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "openai>=2.0.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.13.1",
    "python-multipart",
    "uvicorn[standard]",
]

[project.scripts]
rfq-api = "rfq_api:run"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
